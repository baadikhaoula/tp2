<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDCC - Version 4 | CI/CD Pipeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 90%;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 80px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #f5a623, #e94560);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e94560, #f5a623);
            padding: 5px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .subtitle {
            font-size: 1.3em;
            color: #a8d8ea;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .tech-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px 30px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .tech-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .tech-card .icon {
            font-size: 2em;
            margin-bottom: 8px;
        }

        .tech-card .label {
            font-size: 0.9em;
            color: #ccc;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 15px;
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-text {
            color: #4CAF50;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8em;
            color: #666;
        }

        .pipeline-stages {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .stage {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85em;
            color: #4CAF50;
        }

        .stage-arrow {
            color: #555;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <h1>Welcome BDCC</h1>
        <div class="version-badge">Version 4.0</div>

        <p class="subtitle">CI/CD avec Jenkins et Docker</p>

        <div class="tech-stack">
            <div class="tech-card">
                <div class="icon">🐳</div>
                <div class="label">Docker</div>
            </div>
            <div class="tech-card">
                <div class="icon">⚙️</div>
                <div class="label">Jenkins</div>
            </div>
            <div class="tech-card">
                <div class="icon">🔄</div>
                <div class="label">Pipeline</div>
            </div>
            <div class="tech-card">
                <div class="icon">📊</div>
                <div class="label">Stage View</div>
            </div>
        </div>

        <div class="pipeline-stages">
            <div class="stage">✅ Build</div>
            <span class="stage-arrow">→</span>
            <div class="stage">✅ Test</div>
            <span class="stage-arrow">→</span>
            <div class="stage">✅ Deploy</div>
            <span class="stage-arrow">→</span>
            <div class="stage">🟢 Live</div>
        </div>

        <div class="status-bar">
            <div class="status-dot"></div>
            <span class="status-text">Pipeline actif — Déploiement réussi</span>
        </div>

        <p style="margin-top: 20px; color: #aaa; font-style: italic;">
            Modification du projet pour tester le Stage View !
        </p>

        <div class="footer">
            BDCC Project &copy; 2026 — Propulsé par Jenkins & Docker
        </div>
    </div>
</body>
</html>
